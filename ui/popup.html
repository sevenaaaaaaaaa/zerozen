<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ZeroZen</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 340px;
      }
      .zz-popup-footer {
        padding: 10px 14px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        color: var(--zz-muted);
        font-size: 11px;
      }
      #findings {
        display: grid;
        gap: 6px;
        max-height: 150px;
        overflow: auto;
      }
      #findings .zz-code {
        margin-top: 4px;
        max-height: 44px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="zz-header">
      <div class="zz-brand">
        <img src="../icons/icon48.png" alt="" />
        <span>ZeroZen<b class="zz-brand-sub" data-i18n="广告净化器">广告净化器</b></span>
      </div>
      <label class="zz-switch" title="总开关" data-i18n-title="总开关">
        <input type="checkbox" id="globalEnabled" />
        <span></span>
      </label>
    </div>

    <div class="zz-section">
      <div class="zz-row">
        <div>
          <div class="zz-host" id="host">—</div>
          <div class="zz-small zz-muted" id="siteHint" data-i18n="正在读取站点状态…">正在读取站点状态…</div>
        </div>
        <label class="zz-switch" title="在此站点启用" data-i18n-title="在此站点启用">
          <input type="checkbox" id="siteEnabled" />
          <span></span>
        </label>
      </div>
    </div>

    <div class="zz-stats">
      <div class="zz-stat"><b id="statHidden">0</b><span data-i18n="隐藏广告">隐藏广告</span></div>
      <div class="zz-stat"><b id="statNetwork">0</b><span data-i18n="拦截请求">拦截请求</span></div>
      <div class="zz-stat"><b id="statPopups">0</b><span data-i18n="拦截弹窗">拦截弹窗</span></div>
    </div>

    <div class="zz-section">
      <div class="zz-row">
        <b class="zz-small" data-i18n="保护档位">保护档位</b>
        <span class="zz-small zz-muted" id="profileHint"></span>
      </div>
      <div class="zz-seg" id="profileSeg">
        <button class="zz-seg-btn" data-profile="compat" title="仅通用拦截与视频规则，最大化站点兼容性" data-i18n-title="仅通用拦截与视频规则，最大化站点兼容性" data-i18n="兼容">兼容</button>
        <button class="zz-seg-btn" data-profile="standard" title="推荐：全部内置规则" data-i18n-title="推荐：全部内置规则" data-i18n="标准">标准</button>
        <button class="zz-seg-btn" data-profile="strict" title="移除式处理 + 强制解锁滚动，可能影响站点功能" data-i18n-title="移除式处理 + 强制解锁滚动，可能影响站点功能" data-i18n="严格">严格</button>
      </div>
      <div class="zz-small" id="autoCompatHint" hidden>
        <span class="zz-tag zz-tag-ai" data-i18n="自动回落">自动回落</span>
        <span class="zz-muted" id="autoCompatText"></span>
        <button class="zz-btn zz-btn-sm zz-btn-ghost" id="btnResetAuto" data-i18n="恢复本站设置">恢复本站设置</button>
      </div>
      <div class="zz-actions" style="margin-top: 8px">
        <button class="zz-btn" id="btnTemp" data-i18n="临时解除 30 分钟">临时解除 30 分钟</button>
      </div>
      <div class="zz-row" style="margin-top: 10px">
        <b class="zz-small" data-i18n="屏蔽类型">屏蔽类型</b>
        <span class="zz-small zz-muted" data-i18n="全局生效">全局生效</span>
      </div>
      <div class="zz-chips">
        <label class="zz-chip"><input type="checkbox" data-type="network" /><span data-i18n="网络拦截">网络拦截</span></label>
        <label class="zz-chip"><input type="checkbox" data-type="cosmetic" /><span data-i18n="外观隐藏">外观隐藏</span></label>
        <label class="zz-chip"><input type="checkbox" data-type="popup" /><span data-i18n="弹窗守护">弹窗守护</span></label>
        <label class="zz-chip"><input type="checkbox" data-type="annoyances" /><span data-i18n="烦扰元素">烦扰元素</span></label>
      </div>
    </div>

    <div class="zz-section">
      <div class="zz-row">
        <b class="zz-small" data-i18n="纯净浏览 / 下载">纯净浏览 / 下载</b>
        <button type="button" class="zz-btn zz-btn-sm zz-btn-primary" id="btnToolbox"><span data-i18n="下载本页视频">下载本页视频</span> <span id="sniffCount"></span></button>
      </div>
      <div class="zz-actions" style="margin-top: 8px; grid-template-columns: 1fr 1fr">
        <button type="button" class="zz-btn zz-btn-sm" id="btnClean" data-i18n="纯净浏览">纯净浏览</button>
        <button type="button" class="zz-btn zz-btn-sm" id="btnReader" data-i18n="阅读模式">阅读模式</button>
      </div>
      <div class="zz-small zz-muted" id="toolHint" data-i18n="先在网页里点播放，再点「下载本页视频」。工具箱会列出嗅探到的 m3u8，勾选后下载到 ZeroZen/视频。">先在网页里点播放，再点「下载本页视频」。工具箱会列出嗅探到的 m3u8，勾选后下载到 ZeroZen/视频。</div>
    </div>

    <div class="zz-actions">
      <button class="zz-btn zz-btn-primary" id="btnAi" data-i18n="AI 识别本页烦人广告">AI 识别本页烦人广告</button>
      <button class="zz-btn" id="btnPick" data-i18n="选取元素屏蔽（或按 Alt+Z）">选取元素屏蔽（或按 Alt+Z）</button>
      <button class="zz-btn" id="btnOptions" data-i18n="打开净化控制台">打开净化控制台</button>
    </div>

    <div class="zz-toast-inline" id="msg" hidden></div>

    <div class="zz-section" id="findingsSection" hidden>
      <div class="zz-row">
        <b class="zz-small" data-i18n="AI 待确认（本页）">AI 待确认（本页）</b>
        <button class="zz-btn zz-btn-sm zz-btn-primary" id="btnApplyAll" data-i18n="全部屏蔽">全部屏蔽</button>
      </div>
      <div id="findings" style="margin-top: 8px"></div>
    </div>

    <div class="zz-popup-footer">
      <span id="engineInfo" data-i18n="规则加载中…">规则加载中…</span>
      <a href="#" id="linkReview"><span data-i18n="待审">待审</span> <b id="pendingCount">0</b></a>
    </div>

    <script src="../background/lib-compat.js"></script>
    <script src="../i18n/i18n.js"></script>
    <script src="../i18n/dict-en.js"></script>
    <script src="ui-lib.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
