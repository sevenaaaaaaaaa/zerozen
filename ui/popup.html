<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ZeroZen</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 360px;
      }
      .zz-popup-footer {
        padding: 10px 14px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        color: var(--zz-muted);
        font-size: 11px;
      }
      #findings {
        display: grid;
        gap: 6px;
        max-height: 150px;
        overflow: auto;
      }
      #findings .zz-code {
        margin-top: 4px;
        max-height: 44px;
        overflow: hidden;
      }
      #mediaList {
        display: grid;
        gap: 6px;
        max-height: 190px;
        overflow: auto;
      }
      .zz-media-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 10px;
        border: 1px solid var(--zz-border);
        background: var(--zz-glass-2);
        font-size: 12px;
        position: relative;
        overflow: hidden;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .zz-media-item:hover {
        border-color: var(--zz-border-strong);
        background: rgba(255, 255, 255, 0.07);
      }
      .zz-media-item::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.1) 50%, transparent 60%);
        transform: translateX(-120%);
        pointer-events: none;
      }
      .zz-media-item:hover::after {
        animation: zzShine 0.6s ease;
      }
      @keyframes zzShine {
        to {
          transform: translateX(120%);
        }
      }
      .zz-media-item .mi-kind {
        flex: 0 0 auto;
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 5px;
        background: rgba(61, 123, 253, 0.14);
        color: #8ab6ff;
        font-weight: 600;
      }
      .zz-media-item .mi-url {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--zz-muted);
      }
      #taskList {
        display: grid;
        gap: 6px;
        max-height: 220px;
        overflow: auto;
      }
      .zz-task-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 10px;
        border: 1px solid var(--zz-border);
        background: var(--zz-glass-2);
        font-size: 12px;
      }
      .zz-task-item .ti-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
      }
      .zz-task-item .ti-meta {
        flex: 0 0 auto;
        color: var(--zz-muted);
        font-size: 11px;
      }
      .zz-task-item .ti-bar {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 2px;
        background: var(--zz-accent);
        border-radius: 2px;
        pointer-events: none;
      }
      .zz-task-item.run .ti-bar {
        background: linear-gradient(90deg, var(--zz-accent-2), #6fd3f7, var(--zz-accent-2));
        background-size: 200% 100%;
        animation: zzFlow 1.2s linear infinite;
      }
      .zz-task-item.err .ti-bar {
        background: var(--zz-danger);
        opacity: 0.5;
      }
      @keyframes zzFlow {
        from {
          background-position: 0% 0;
        }
        to {
          background-position: 200% 0;
        }
      }
      .zz-task-item {
        position: relative;
        overflow: hidden;
      }
      .zz-chipbar-sm {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 8px;
      }
      .zz-chipbar-sm button {
        font: inherit;
        font-size: 11px;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid var(--zz-border);
        background: transparent;
        color: var(--zz-muted);
        cursor: pointer;
        transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
      }
      .zz-chipbar-sm button:hover {
        color: var(--zz-text);
      }
      .zz-chipbar-sm button.active {
        border-color: rgba(91, 157, 255, 0.55);
        color: var(--zz-accent);
        background: rgba(61, 123, 253, 0.1);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="zz-header">
      <div class="zz-brand">
        <img src="../icons/icon48.png" alt="" />
        <span>ZeroZen <b class="zz-brand-sub" data-i18n="广告净化器">广告净化器</b></span>
      </div>
      <label class="zz-switch" title="总开关" data-i18n-title="总开关">
        <input type="checkbox" id="globalEnabled" />
        <span></span>
      </label>
    </div>

    <div class="zz-section">
      <div class="zz-row">
        <div>
          <div class="zz-host" id="host">—</div>
          <div class="zz-small zz-muted" id="siteHint" data-i18n="正在读取站点状态…">正在读取站点状态…</div>
        </div>
        <label class="zz-switch" title="在此站点启用" data-i18n-title="在此站点启用">
          <input type="checkbox" id="siteEnabled" />
          <span></span>
        </label>
      </div>
    </div>

    <div class="zz-stats">
      <div class="zz-stat"><b id="statHidden">0</b><span data-i18n="隐藏广告">隐藏广告</span></div>
      <div class="zz-stat"><b id="statNetwork">0</b><span data-i18n="拦截请求">拦截请求</span></div>
      <div class="zz-stat"><b id="statPopups">0</b><span data-i18n="拦截弹窗">拦截弹窗</span></div>
    </div>

    <div class="zz-section" id="mediaSection" hidden>
      <div class="zz-row">
        <b class="zz-small" data-i18n="本页媒体">本页媒体</b>
        <button type="button" class="zz-btn zz-btn-sm" id="btnRescan" data-i18n="重新嗅探">重新嗅探</button>
      </div>
      <div id="mediaList" style="margin-top: 8px"></div>
      <div class="zz-small zz-muted" id="mediaHint" style="margin-top: 6px"></div>
    </div>

    <div class="zz-section" id="taskSection" hidden>
      <div class="zz-row">
        <b class="zz-small" data-i18n="任务中心">任务中心</b>
        <select id="taskSort" class="zz-select" style="flex: 1; max-width: 120px">
          <option value="time" data-i18n="按时间">按时间</option>
          <option value="size" data-i18n="按大小">按大小</option>
          <option value="speed" data-i18n="按速度">按速度</option>
          <option value="name" data-i18n="按字母">按字母</option>
          <option value="state" data-i18n="按状态">按状态</option>
        </select>
        <button type="button" class="zz-btn zz-btn-sm" id="btnTaskRefresh" data-i18n="刷新">刷新</button>
      </div>
      <div class="zz-chipbar-sm" id="taskFilters">
        <button data-cat="all" class="active" data-i18n="全部">全部</button>
        <button data-cat="video" data-i18n="视频">视频</button>
        <button data-cat="audio" data-i18n="音频">音频</button>
        <button data-cat="image" data-i18n="图片">图片</button>
        <button data-cat="archive" data-i18n="压缩包">压缩包</button>
        <button data-cat="doc" data-i18n="文档">文档</button>
        <button data-cat="other" data-i18n="其他">其他</button>
      </div>
      <div class="zz-chipbar-sm" id="taskStateFilters">
        <button data-state="all" class="active" data-i18n="全部">全部</button>
        <button data-state="run" data-i18n="下载中">下载中</button>
        <button data-state="paused" data-i18n="已暂停">已暂停</button>
        <button data-state="done" data-i18n="已完成">已完成</button>
        <button data-state="err" data-i18n="失败">失败</button>
      </div>
      <div id="taskList" style="margin-top: 8px"></div>
    </div>

    <div class="zz-section">
      <div class="zz-row">
        <b class="zz-small" data-i18n="保护档位">保护档位</b>
        <span class="zz-small zz-muted" id="profileHint"></span>
      </div>
      <div class="zz-seg" id="profileSeg">
        <button class="zz-seg-btn" data-profile="compat" title="仅通用拦截与视频规则，最大化站点兼容性" data-i18n-title="仅通用拦截与视频规则，最大化站点兼容性" data-i18n="兼容">兼容</button>
        <button class="zz-seg-btn" data-profile="standard" title="推荐：全部内置规则" data-i18n-title="推荐：全部内置规则" data-i18n="标准">标准</button>
        <button class="zz-seg-btn" data-profile="strict" title="移除式处理 + 强制解锁滚动，可能影响站点功能" data-i18n-title="移除式处理 + 强制解锁滚动，可能影响站点功能" data-i18n="严格">严格</button>
      </div>
      <div class="zz-small" id="autoCompatHint" hidden>
        <span class="zz-tag zz-tag-ai" data-i18n="自动回落">自动回落</span>
        <span class="zz-muted" id="autoCompatText"></span>
        <button class="zz-btn zz-btn-sm zz-btn-ghost" id="btnResetAuto" data-i18n="恢复本站设置">恢复本站设置</button>
      </div>
      <div class="zz-actions" style="margin-top: 8px">
        <button class="zz-btn" id="btnTemp" data-i18n="临时解除 30 分钟">临时解除 30 分钟</button>
      </div>
      <div class="zz-row" style="margin-top: 10px">
        <b class="zz-small" data-i18n="屏蔽类型">屏蔽类型</b>
        <span class="zz-small zz-muted" data-i18n="全局生效">全局生效</span>
      </div>
      <div class="zz-chips">
        <label class="zz-chip"><input type="checkbox" data-type="network" /><span data-i18n="网络拦截">网络拦截</span></label>
        <label class="zz-chip"><input type="checkbox" data-type="cosmetic" /><span data-i18n="外观隐藏">外观隐藏</span></label>
        <label class="zz-chip"><input type="checkbox" data-type="popup" /><span data-i18n="弹窗守护">弹窗守护</span></label>
        <label class="zz-chip"><input type="checkbox" data-type="annoyances" /><span data-i18n="烦扰元素">烦扰元素</span></label>
      </div>
    </div>

    <div class="zz-section">
      <div class="zz-actions" style="padding: 0; grid-template-columns: 1fr 1fr">
        <button type="button" class="zz-btn zz-btn-sm" id="btnClean" data-i18n="纯净浏览">纯净浏览</button>
        <button type="button" class="zz-btn zz-btn-sm" id="btnReader" data-i18n="阅读模式">阅读模式</button>
      </div>
      <div class="zz-actions" style="padding: 8px 0 0">
        <button class="zz-btn zz-btn-primary" id="btnAi" data-i18n="AI 识别本页烦人广告">AI 识别本页烦人广告</button>
        <button class="zz-btn" id="btnPick" data-i18n="选取元素屏蔽（或按 Alt+Z）">选取元素屏蔽（或按 Alt+Z）</button>
        <button class="zz-btn" id="btnOptions" data-i18n="打开净化控制台">打开净化控制台</button>
      </div>
    </div>

    <div class="zz-toast-inline" id="msg" hidden></div>

    <div class="zz-section" id="findingsSection" hidden>
      <div class="zz-row">
        <b class="zz-small" data-i18n="AI 待确认（本页）">AI 待确认（本页）</b>
        <button class="zz-btn zz-btn-sm zz-btn-primary" id="btnApplyAll" data-i18n="全部屏蔽">全部屏蔽</button>
      </div>
      <div id="findings" style="margin-top: 8px"></div>
    </div>

    <div class="zz-popup-footer">
      <span id="engineInfo" data-i18n="规则加载中…">规则加载中…</span>
      <a href="#" id="linkReview"><span data-i18n="待审">待审</span> <b id="pendingCount">0</b></a>
    </div>

    <script src="../background/lib-compat.js"></script>
    <script src="../i18n/i18n.js"></script>
    <script src="../i18n/dict-en.js"></script>
    <script src="ui-lib.js"></script>
    <script src="dl-store.js"></script>
    <script src="dl-engine.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
