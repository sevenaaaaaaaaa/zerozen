<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="ZeroZen 下载工具箱">ZeroZen 下载工具箱</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        margin: 0;
        padding: 24px 28px 70px;
        max-width: 1100px;
        margin-inline: auto;
      }
      .zz-tool-tabs {
        display: flex;
        gap: 2px;
        margin: 14px 0 16px;
        padding: 3px;
        width: fit-content;
        border-radius: 10px;
        background: rgba(17, 24, 39, 0.06);
      }
      .zz-tool-tab {
        font: inherit;
        font-size: 13px;
        padding: 5px 14px;
        border-radius: 8px;
        border: 0;
        background: transparent;
        color: var(--zz-muted);
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .zz-tool-tab.active {
        background: #fff;
        color: var(--zz-text);
        font-weight: 600;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.12);
      }
      .zz-tool-panel {
        display: none;
        background: var(--zz-panel);
        border: 1px solid var(--zz-border);
        border-radius: var(--zz-radius, 14px);
        box-shadow: var(--zz-shadow, 0 1px 2px rgba(0, 0, 0, 0.24));
        padding: 14px 16px;
      }
      .zz-tool-panel.active {
        display: block;
      }
      .zz-tool-row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .zz-tool-log {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        background: #f2f3f7;
        border: 1px solid var(--zz-border);
        border-radius: 10px;
        padding: 12px 14px;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
      }
      .zz-media-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
        margin-top: 12px;
      }
      .zz-media-card {
        border: 1px solid var(--zz-border);
        border-radius: 10px;
        overflow: hidden;
        background: var(--zz-panel-2);
      }
      .zz-media-card img {
        width: 100%;
        height: 110px;
        object-fit: cover;
        display: block;
        background: rgba(127, 127, 127, 0.1);
      }
      .zz-media-meta {
        padding: 6px 8px;
        font-size: 11px;
        line-height: 1.4;
        word-break: break-all;
      }
      .zz-pay {
        font-size: 12px;
        color: #8b949e;
        margin-top: 14px;
      }
      .zz-pay a {
        color: #3b82f6;
      }
      .zz-tool-list {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }
      .zz-tool-item {
        display: flex;
        gap: 9px;
        align-items: center;
        border: 1px solid var(--zz-border);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 12.5px;
        background: var(--zz-panel-2);
      }
      .zz-tool-item .url {
        flex: 1;
        word-break: break-all;
      }
      .zz-tool-item .code {
        font-family: ui-monospace, monospace;
        color: #d97706;
      }
      .zz-chipbar {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .zz-chipbar label {
        font-size: 12px;
        border: 1px solid var(--zz-border);
        border-radius: 999px;
        padding: 3px 10px;
        cursor: pointer;
        background: transparent;
        transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
      }
      .zz-chipbar label:has(input:checked) {
        border-color: rgba(91, 157, 255, 0.55);
        color: var(--zz-accent);
        background: rgba(61, 123, 253, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="zz-header" style="padding: 0">
      <div class="zz-brand">
        <img src="../icons/icon48.png" alt="" />
        <span data-i18n="零真">零真</span> <b class="zz-brand-sub" data-i18n="下载工具箱">下载工具箱</b></span>
      </div>
      <span class="zz-tag" id="ctxLabel" data-i18n="读取页面…">读取页面…</span>
    </div>

    <div class="zz-tool-tabs">
      <button class="zz-tool-tab active" data-view="video" data-i18n="视频下载">视频下载</button>
      <button class="zz-tool-tab" data-view="image" data-i18n="图片发现">图片发现</button>
      <button class="zz-tool-tab" data-view="netdisk" data-i18n="网盘资源">网盘资源</button>
      <button class="zz-tool-tab" data-view="misfire" data-i18n="误拦反馈">误拦反馈</button>
    </div>

    <div class="zz-tool-panel active" id="view-video">
      <div class="zz-tool-row">
        <span class="zz-small zz-muted" data-i18n="先在页面里播放视频，这里会自动出现可下载的地址；任务统一在下载中心管理，关掉本页也不会中断。">先在页面里播放视频，这里会自动出现可下载的地址；任务统一在下载中心管理，关掉本页也不会中断。</span>
        <span style="flex: 1"></span>
        <button class="zz-btn zz-btn-sm" id="btnStreams" data-i18n="重新检测">重新检测</button>
        <button class="zz-btn zz-btn-sm zz-btn-primary" id="btnCenter" data-i18n="打开下载中心">打开下载中心</button>
      </div>
      <div id="streamList" style="margin-top: 10px; max-width: 760px"></div>
      <div id="videoTasks" style="margin-top: 10px; max-width: 760px"></div>
      <div class="zz-toast-inline" id="videoMsg" hidden></div>
    </div>
    <div class="zz-tool-panel" id="view-image">
      <div class="zz-tool-row">
        <button class="zz-btn zz-btn-sm" id="btnImages" data-i18n="扫描本页图片">扫描本页图片</button>
        <span class="zz-small"><span data-i18n="最小尺寸">最小尺寸</span> <input type="number" id="imgMin" value="0" min="0" step="16" style="width: 70px" /> px</span>
        <button class="zz-btn zz-btn-sm" id="btnImgAll" data-i18n="全选">全选</button>
        <button class="zz-btn zz-btn-sm" id="btnImgNone" data-i18n="全不选">全不选</button>
        <button class="zz-btn zz-btn-sm zz-btn-primary" id="btnImgDownload" data-i18n="下载选中">下载选中</button>
        <label class="zz-small"><span data-i18n="目录">目录</span> <input type="text" id="imageDir" style="width: 160px" /></label>
      </div>
      <div class="zz-chipbar" id="imgFormats"></div>
      <div class="zz-small zz-muted" id="imgInfo" style="margin-top: 6px"></div>
      <div class="zz-media-grid" id="imageGrid"></div>
      <div class="zz-tool-log" id="imageLog" style="margin-top: 10px"></div>
    </div>

    <div class="zz-tool-panel" id="view-netdisk">
      <div class="zz-tool-row">
        <button class="zz-btn zz-btn-sm" id="btnNetdisk" data-i18n="扫描本页资源">扫描本页资源</button>
        <button class="zz-btn zz-btn-sm" id="btnCopyAll" data-i18n="复制全部">复制全部</button>
        <button class="zz-btn zz-btn-sm" id="btnExport" data-i18n="导出 TXT">导出 TXT</button>
        <span class="zz-small zz-muted" data-i18n="自动提取网盘链接与提取码，仅收集不代替你下载/转存。">自动提取网盘链接与提取码，仅收集不代替你下载/转存。</span>
      </div>
      <div class="zz-tool-list" id="netdiskList"></div>
      <div class="zz-tool-log" id="netdiskLog" style="margin-top: 10px"></div>
    </div>

    <div class="zz-tool-panel" id="view-misfire">
      <div class="zz-tool-row">
        <button class="zz-btn zz-btn-sm" id="btnMisfireScan" data-i18n="扫描误拦">扫描误拦</button>
        <span class="zz-small zz-muted" data-i18n="列出被净化规则隐藏的元素；确属误拦时点「放行」，本站恢复显示。网站自己隐藏的元素也会出现在列表里。">列出被净化规则隐藏的元素；确属误拦时点「放行」，本站恢复显示。网站自己隐藏的元素也会出现在列表里。</span>
      </div>
      <div class="zz-tool-list" id="misfireList"></div>
      <div class="zz-tool-log" id="misfireLog" style="margin-top: 10px"></div>
    </div>

    <div class="zz-pay" id="payLine"></div>

    <script src="../background/lib-compat.js"></script>
    <script src="../i18n/i18n.js"></script>
    <script src="../i18n/dict-en.js"></script>
    <script src="ui-lib.js"></script>
    <script src="dl-engine.js"></script>
    <script src="dl-ui.js"></script>
    <script src="toolbox.js"></script>
  </body>
</html>
